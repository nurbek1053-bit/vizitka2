vec2 P=(vUv-.5)*2.;vec2 p=rot(P,.3),p2=rot(P,1.65);
float r=length(p);float hz=smoothstep(.206,.194,r);
vec3 d1=dk(p,.17,.98,1.,0.),d2=dk(p2,.34,.78,.6,4.)*vec3(.8,.95,1.25);
vec3 back=d1*step(0.,p.y)+d2*step(0.,p2.y),front=d1*step(p.y,0.)+d2*step(p2.y,0.);
float rl=length(vec2(p.x,p.y*.6));
float lens=smoothstep(.2,.25,rl)*(1.-smoothstep(.25,.6,rl));float tl=1.-smoothstep(.2,.62,rl);
float a3=atan(p.y,p.x)-uT*1.1/(rl+.25);float f3=fbm(rl*vec2(cos(a3),sin(a3))*9.+3.);
float bm2=pow(1.-.62*clamp(p.x/max(rl,.001),-1.,1.),2.)*.55;
vec3 arc=ramp(tl)*(.3+1.4*tl)*(.5+f3)*bm2*lens*.9;
float ring=exp(-pow((r-.212)*55.,2.))*1.8*(.6+1.2*bm2);
float glow=exp(-r*3.2)*.35;
vec3 col=(back+arc+vec3(1.,.9,.7)*ring+vec3(1.,.45,.1)*glow)*(1.-hz)+front;
float m=smoothstep(1.,.8,length(P))*vF;col*=m;
float al=clamp(hz*m+max(front.r,max(front.g,front.b))*m,0.,1.);
gl_FragColor=vec4(col,al);}`;
const sunF=`varying vec2 vUv;varying vec4 vP;varying vec3 vA,vB;varying float vF;uniform float uT;${NZ}
void main(){vec2 p=(vUv-.5)*2.;float r=length(p),R0=.28,a=atan(p.y,p.x);float T=uT+vP.x*30.;
float pul=1.+.1*sin(T*1.7)+.05*sin(T*3.1);vec3 col=vec3(0.);
if(r<R0){float x=r/R0,mu=sqrt(1.-x*x);vec2 sp=p/R0*3.+vP.x;
float g=fbm(sp+vec2(T*.08,0.)+fbm(sp*1.7-T*.05)*1.2);col=mix(vA,vB,pow(mu,.7)*(.55+.9*g))*1.4;}
float e=max(r-R0,0.);vec3 hc=mix(vA,vB,.45);
float glow=exp(-e*9.)*.9*pul;
float ray=pow(fbm(vec2(a*4.,T*.05+r*1.5))*1.3,3.)*exp(-e*4.5)*1.1;
float pr=smoothstep(.5,.8,fbm(vec2(cos(a),sin(a))*2.5+T*.04))*exp(-e*22.)*step(R0,r)*2.2*(.6+.4*sin(T*.9+a*3.));
float st=exp(-abs(p.y)*38.)*exp(-abs(p.x)*3.)*.55*pul+exp(-abs(p.x)*38.)*exp(-abs(p.y)*3.)*.25;
col+=hc*1.2*(glow+ray)+vA*1.1*pr+vB*st;
col*=smoothstep(1.,.75,r)*vF;gl_FragColor=vec4(col,1.);}`;
const plF=`varying vec2 vUv;varying vec4 vP;varying vec3 vA,vB,vL;varying float vF;uniform float uT;${NZ}
void main(){vec2 p=(vUv-.5)*2.;float sd=vP.x,kind=vP.y;float R=kind>2.5?.55:.8;
float r=length(p)/R;vec3 col=vec3(0.);float a=0.;
if(r<1.){vec3 nm=vec3(p/R,sqrt(1.-r*r));float dif=clamp(dot(nm,vL),0.,1.);
float u=atan(nm.x,nm.z)+uT*.03*(.5+fract(sd*3.)),v=nm.y;vec2 em=vec2(cos(u),sin(u))*2.+vec2(v*2.6,sd);vec3 sc;
if(kind<.5){float g=fbm(em*1.7);sc=mix(vA,vB,g)*(.7+.5*fbm(em*6.));}
else if(kind<1.5){float g=fbm(em*1.5);sc=mix(vA,vB,smoothstep(.5,.57,g));sc=mix(sc,vec3(1.),smoothstep(.56,.8,fbm(em*2.4+3.))*.75);sc=mix(sc,vec3(.95),smoothstep(.86,.93,abs(v)));}
else{float b=sin(v*(8.+fract(sd)*9.)+fbm(vec2(cos(u),sin(u))*1.5+v*3.)*3.5);sc=mix(vA,vB,b*.5+.5);}
col=sc*(.05+dif*1.15)+vA*pow(1.-nm.z,3.)*(.15+dif*.5);a=1.;}
else{float g=exp(-(r-1.)*12.);col=vA*g*.45;a=g*.5;}
if(kind>2.5){float cs=cos(vP.z),sn=sin(vP.z);vec2 q=mat2(cs,-sn,sn,cs)*p;float rr=length(vec2(q.x,q.y/.26));
float ra=smoothstep(.6,.64,rr)*(1.-smoothstep(.94,1.,rr))*(.55+.45*sin(rr*95.+sd*9.))*.9;
vec3 rc=mix(vB,vec3(1.),.45)*(.45+.55*max(dot(normalize(vec3(0.,1.,.3)),vL),.3));
if(q.y<0.||r>=1.){col=mix(col,rc,ra);a=max(a,ra);}}
gl_FragColor=vec4(col,a*vF);}`;

/* ---------- WebGL cosmos ---------- */
const PR=Math.min(window.devicePixelRatio||1,2);
const rnd=Math.random,gs=()=>rnd()+rnd()+rnd()-1.5,ADD=THREE.AdditiveBlending;
const WW=7200,HW=WW/2;
let renderer,scene,camera,ready=false,baseFov=62,pm=[],nebM,sky,rocks,rockData=[],bodies=[],U;
const pos=new THREE.Vector3(0,0,300),vel=new THREE.Vector3();
const LW=new THREE.Vector3(-.55,.3,-.78).normalize(),BELT=new THREE.Vector3(-380,40,-650);
const wr=(x,c)=>{let d=x-c+HW;d-=Math.floor(d/WW)*WW;return d-HW+c};
const SM=(vs,fs,u,o)=>new THREE.ShaderMaterial(Object.assign({vertexShader:vs,fragmentShader:fs,uniforms:u,transparent:true,depthWrite:false},o||{}));
// spectral classes O B A F G K M
const SC=[[.62,.72,1],[.72,.82,1],[.92,.95,1],[1,.97,.9],[1,.9,.72],[1,.72,.45],[1,.46,.3]],SW=[.02,.07,.1,.16,.2,.25,.2];
const kc=()=>{let r=rnd(),i=0;while(i<6&&r>SW[i]){r-=SW[i];i++}return SC[i]};
const hc=(()=>{const c=new THREE.Color();return(h,s,l)=>{c.setHSL(h,s,l);return[c.r,c.g,c.b]}})();
const sph=(a,b)=>{const z=rnd()*2-1,t=rnd()*6.283,q=Math.sqrt(1-z*z),R=a+rnd()*(b-a);return[q*Math.cos(t)*R,z*R,q*Math.sin(t)*R]};
function mkG(N,fn){
  const P=new Float32Array(N*3),C=new Float32Array(N*3),S=new Float32Array(N),H=new Float32Array(N);
  for(let i=0;i<N;i++){const o=fn(i);P.set(o.p,i*3);C.set(o.c,i*3);S[i]=o.s;H[i]=rnd()}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('aC',new THREE.BufferAttribute(C,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(S,1));g.setAttribute('aPh',new THREE.BufferAttribute(H,1));return g;
}
function PM(o){const m=SM(starV,starF,Object.assign({uPR:{value:PR},uT:{value:0},uScale:{value:0},uWrap:{value:0},uTw:{value:.3},uCam:{value:pos}},o),{blending:ADD});pm.push(m);return m}
function pts(g,m,ro){const p=new THREE.Points(g,m);p.frustumCulled=false;p.renderOrder=ro;scene.add(p);return p}
// one InstancedMesh per celestial class; positions wrap around the camera in the vertex shader (endless flight)
function layer(frag,N,ro,u,mo,rad,fn){
  const g=new THREE.PlaneGeometry(1,1),P=new Float32Array(N*3),S=new Float32Array(N),Q=new Float32Array(N*4),A=new Float32Array(N*3),B=new Float32Array(N*3);
  for(let i=0;i<N;i++){const d=fn(i);P.set(d.p,i*3);S[i]=d.s;Q.set(d.q,i*4);A.set(d.a,i*3);B.set(d.b,i*3);
    if(rad)bodies.push({p:new THREE.Vector3(d.p[0],d.p[1],d.p[2]),r:rad(d)})}
  g.setAttribute('iPos',new THREE.InstancedBufferAttribute(P,3));g.setAttribute('iS',new THREE.InstancedBufferAttribute(S,1));
  g.setAttribute('iP',new THREE.InstancedBufferAttribute(Q,4));g.setAttribute('iC1',new THREE.InstancedBufferAttribute(A,3));g.setAttribute('iC2',new THREE.InstancedBufferAttribute(B,3));
  const m=new THREE.InstancedMesh(g,SM(bbV,frag,Object.assign({},U,u),mo),N);
  m.frustumCulled=false;m.renderOrder=ro;scene.add(m);return m;
}
function initGL(){
  renderer=new THREE.WebGLRenderer({canvas:$('#bg'),antialias:false,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x000000,1);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.5,12000);camera.rotation.order='YXZ';
  U={uCam:{value:pos},uW:{value:WW},uLW:{value:LW},uT:{value:0}};

  sky=new THREE.Mesh(new THREE.SphereGeometry(9000,32,16),SM(skyV,skyF,{uT:{value:0},uL:{value:0}},{side:THREE.BackSide,depthTest:false}));
  sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);

  // layered emission nebulae
  const pal=[[[0,.55,.9],[.8,.1,.6]],[[.5,.2,1],[0,.7,.8]],[[1,.4,.15],[.8,.1,.4]],[[.1,.3,1],[.6,.15,.9]],[[0,.8,.7],[.3,.2,.9]],[[.9,.3,.5],[1,.6,.2]]];
  nebM=layer(nebF,coarse?9:14,-2,{uI:{value:.5}},{blending:ADD},null,i=>({p:sph(1500,3400),s:1800+rnd()*1800,q:[rnd()*50,0,0,0],a:pal[i%6][0],b:pal[i%6][1]}));

  // 66k spectral-class stars on a camera-following shell + two wrapping parallax layers
  const star=()=>{const c=kc(),b=.55+.45*rnd();return{p:sph(4000,5500),c:[c[0]*b,c[1]*b,c[2]*b],s:1.3+Math.pow(rnd(),7)*4}};
  const far=pts(mkG(66000,star),PM({}),-1);far.userData.follow=1;pm.far=far;
  const wrapL=(N,W,sz)=>pts(mkG(N,()=>{const c=kc();return{p:[rnd()*W,rnd()*W,rnd()*W],c,s:1.3+Math.pow(rnd(),5)*sz}}),PM({uWrap:{value:W},uTw:{value:.25}}),3);
  wrapL(5000,2400,2.6);wrapL(4500,1200,3.2);

  // 72 procedural spiral & elliptical galaxies
  const GP=[[[.55,.25,1],[.9,.55,1]],[[0,.7,1],[.55,.92,1]],[[1,.65,.15],[1,.9,.5]],[[.9,.1,.25],[1,.45,.55]]];
  const hero=[[900,-300,-3000,2600,.5,4],[-1900,800,-2700,2000,.35,3],[1700,900,-3300,2200,.7,2]];
  layer(galF,coarse?64:72,0,{},{blending:ADD},null,i=>{const h=hero[i],pl=GP[i%4];
    return{p:h?[h[0],h[1],h[2]]:sph(1700,3400),s:h?h[3]:700+rnd()*1700,q:[rnd()*50,h?h[4]:.2+rnd()*.8,rnd()*6.28,h?h[5]:(rnd()<.22?0:2+Math.floor(rnd()*3))],a:pl[0],b:pl[1]}});

  // Gargantua black hole with dual-plane accretion disk
  layer(bhF,1,1,{},{blending:THREE.CustomBlending,blendEquation:THREE.AddEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneMinusSrcAlphaFactor},()=>420,()=>({p:[300,160,-1700],s:1100,q:[0,0,0,0],a:[0,0,0],b:[0,0,0]}));

  // procedural planets: rocky, terrestrial, banded gas giants, ringed worlds
  layer(plF,coarse?40:56,1.5,{},{},d=>d.s*.55,i=>{const k=Math.floor(rnd()*4),s=70+Math.pow(rnd(),2)*260;let a,b;
    if(k===0){a=hc(.05+rnd()*.1,.2+rnd()*.2,.2);b=hc(.06+rnd()*.1,.35,.55)}
    else if(k===1){a=hc(.58+rnd()*.05,.7,.3);b=rnd()<.6?hc(.3,.5,.3):hc(.1,.5,.5)}
    else if(k===2){const h=rnd()<.5?.07:.58;a=hc(h+rnd()*.04,.6,.4);b=hc(h+.06,.5,.78)}
    else{a=hc(.1+rnd()*.05,.55,.45);b=hc(.12,.4,.8)}
    return{p:i<6?sph(500,1600):sph(600,3300),s,q:[rnd()*50,k,rnd()*6.28,0],a,b}});

  // suns with pulsing coronas, prominences and lens flares
  const SU=[[[.3,.5,1],[.85,.92,1]],[[1,.6,.1],[1,.95,.6]],[[1,.3,.05],[1,.7,.3]],[[.8,.1,.05],[1,.45,.2]],[[.5,.3,1],[.9,.8,1]],[[1,.5,.2],[1,.85,.6]]];
  layer(sunF,7,2,{},{blending:ADD},d=>d.s*.4,i=>i?{p:sph(1800,3300),s:450+rnd()*450,q:[rnd()*50,0,0,0],a:SU[i-1][0],b:SU[i-1][1]}:
    {p:[-1000,300,-1300],s:700,q:[0,0,0,0],a:[1,.35,.04],b:[1,.9,.55]});

  // tumbling asteroid belt (InstancedMesh)
  const ag=new THREE.IcosahedronGeometry(1,1),ap=ag.attributes.position;
  for(let i=0;i<ap.count;i++){const x=ap.getX(i),y=ap.getY(i),z=ap.getZ(i);
    const k=1+.38*(Math.sin(x*4.1+1.3)*Math.sin(y*3.7+.4)*Math.sin(z*4.9+2.1))+.12*Math.sin(x*9+y*7);ap.setXYZ(i,x*k,y*k*.8,z*k)}
  ag.computeVertexNormals();
  const NA=coarse?280:520;
  rocks=new THREE.InstancedMesh(ag,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95,metalness:.08,flatShading:true}),NA);
  rocks.frustumCulled=false;const col=new THREE.Color();
  for(let i=0;i<NA;i++){const s=1.5+Math.pow(rnd(),3)*13;
    rockData.push({a:rnd()*6.283,r:260+rnd()*260,h:gs()*40,w:.012+rnd()*.03,ax:new THREE.Vector3(gs(),gs(),gs()).normalize(),sp:.2+rnd()*1.2,ph:rnd()*6,s:[s,s*(.6+rnd()*.6),s*(.7+rnd()*.5)]});
    col.setHSL(.07+rnd()*.05,.15+rnd()*.25,.28+rnd()*.3);rocks.setColorAt(i,col)}
  scene.add(rocks);
  const dl=new THREE.DirectionalLight(0xffe0b0,2.6);dl.position.copy(LW).multiplyScalar(100);scene.add(dl);
  scene.add(new THREE.HemisphereLight(0x5a78ff,0x201030,.35));
  ready=true;applyFov();
}
const dummy=new THREE.Object3D();
function updateRocks(t,dt){
  for(let i=0;i<rockData.length;i++){const d=rockData[i];d.a+=d.w*dt;
    dummy.position.set(wr(BELT.x+Math.cos(d.a)*d.r,pos.x),wr(BELT.y+d.h+Math.sin(d.a)*d.r*.16,pos.y),wr(BELT.z+Math.sin(d.a)*d.r*.9,pos.z));
    dummy.quaternion.setFromAxisAngle(d.ax,d.sp*t+d.ph);dummy.scale.set(d.s[0],d.s[1],d.s[2]);dummy.updateMatrix();rocks.setMatrixAt(i,dummy.matrix)}
  rocks.instanceMatrix.needsUpdate=true;
}
function applyTheme(t){
  document.documentElement.dataset.theme=t;store.set('theme',t);$('#themeIc').innerHTML=t==='light'?ICON.moon:ICON.sun;
  if(!ready)return;const L=t==='light';sky.material.uniforms.uL.value=L?1:0;nebM.material.uniforms.uI.value=L?.7:.5;
}

/* ---------- free-flight navigation ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let yaw=-.05,pitch=.05,yawT=-.05,pitchT=.05,zoom=1,zoomT=1,roll=0;
const ptrs=new Map();let pinchD=0;
const cv=$('#bg');
const camR=new THREE.Vector3(),camU=new THREE.Vector3(),camF=new THREE.Vector3(),tmp=new THREE.Vector3();
function applyFov(){if(!ready)return;baseFov=innerWidth<innerHeight?80:62;camera.fov=baseFov*zoom;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
function look(dx,dy){const s=.0046*clamp(zoom,.2,1.3);yawT+=dx*s;pitchT=clamp(pitchT+dy*s,-1.5,1.5)}
function pan(dx,dy){const k=.6*zoom;vel.addScaledVector(camR,-dx*k).addScaledVector(camU,dy*k)}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});pinchD=0});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){(e.shiftKey||p.b>0)?pan(dx,dy):look(dx,dy)}
  else if(ptrs.size===2){
    const o=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
    const d=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    if(pinchD>0)zoomT=clamp(zoomT*pinchD/d,.1,1.5);pinchD=d;pan(dx*.5,dy*.5);
  }
  p.x=e.clientX;p.y=e.clientY;
});
const end=e=>{ptrs.delete(e.pointerId);pinchD=0};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomT=clamp(zoomT*Math.exp(e.deltaY*.0013),.1,1.5)},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')yawT+=.08;else if(k==='arrowright'||k==='d')yawT-=.08;
  else if(k==='arrowup'||k==='w')pitchT=clamp(pitchT+.06,-1.5,1.5);else if(k==='arrowdown'||k==='s')pitchT=clamp(pitchT-.06,-1.5,1.5)});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#snd')){initAudio();if(AC&&AC.state==='suspended')AC.resume()}},{passive:true});

/* ---------- UI wiring ---------- */
const card=$('#card');
card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();
  card.style.setProperty('--gx',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--gy',((e.clientY-r.top)/r.height*100)+'%')},{passive:true});
$$('.link').forEach(l=>{
  l.addEventListener('pointermove',e=>{const r=l.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
    l.style.setProperty('--mx',(dx+.5)*100+'%');l.style.setProperty('--my',(dy+.5)*100+'%');l.style.transform=`translate(${dx*8}px,${dy*6}px) scale(1.025)`},{passive:true});
  l.addEventListener('pointerleave',()=>{l.style.transform=''});
});
$$('.link,.tog,#lang button').forEach(el=>{el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')chime()});el.addEventListener('click',click)});
$('#theme').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
$('#snd').addEventListener('click',()=>{if(!audioStarted){initAudio();setSound(true);return}setSound(!soundOn)});
$('#eye').addEventListener('click',()=>{hidden=!hidden;card.classList.toggle('gone',hidden);setEye();chime()});
$$('#lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
addEventListener('resize',()=>{if(!ready)return;renderer.setSize(innerWidth,innerHeight,false);applyFov()});

/* ---------- loop ---------- */
let last=performance.now(),cruise=reduce?8:34;
function repel(dt){for(const b of bodies){tmp.set(wr(b.p.x,pos.x)-pos.x,wr(b.p.y,pos.y)-pos.y,wr(b.p.z,pos.z)-pos.z);
  const L=tmp.length();if(L<b.r)pos.addScaledVector(tmp,-(b.r-L)/Math.max(L,1)*Math.min(1,dt*2.5))}}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05),t=now/1000;last=now;
  const k=1-Math.exp(-dt*4.5);
  const dY=yawT-yaw;yaw+=dY*k;pitch+=(pitchT-pitch)*k;zoom+=(zoomT-zoom)*(1-Math.exp(-dt*6));
  roll+=(clamp(dY*.35,-.28,.28)-roll)*k;
  card.style.transform=`rotateX(${clamp((pitchT-pitch)*40,-6,6)}deg) rotateY(${clamp(-dY*40,-8,8)}deg)`;
  if(!ready)return;
  camera.rotation.set(pitch,yaw,roll,'YXZ');
  camF.set(0,0,-1).applyQuaternion(camera.quaternion);camR.set(1,0,0).applyQuaternion(camera.quaternion);camU.set(0,1,0).applyQuaternion(camera.quaternion);
  vel.multiplyScalar(Math.exp(-dt*1.6));
  pos.addScaledVector(camF,cruise*dt).addScaledVector(vel,dt);
  repel(dt);
  ['x','y','z'].forEach(a=>{if(Math.abs(pos[a])>WW*3)pos[a]-=Math.sign(pos[a])*WW*2}); // seamless rebase (all wraps divide WW)
  camera.position.copy(pos);
  if(Math.abs(camera.fov-baseFov*zoom)>.01){camera.fov=baseFov*zoom;camera.updateProjectionMatrix()}
  sky.position.copy(pos);pm.far.position.copy(pos);
  U.uT.value=t;sky.material.uniforms.uT.value=t;pm.forEach(m=>m.uniforms.uT.value=t);
  updateRocks(t,dt);
  renderer.render(scene,camera);
}

/* ---------- boot ---------- */
setLang(lang);setSound(true);
try{initGL()}catch(e){console.warn('WebGL unavailable',e);ready=false}
applyTheme(store.get('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
requestAnimationFrame(frame);
})();
</script>
</body>

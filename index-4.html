/* ---------- GLSL ---------- */
const NZ=`float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float glow=exp(-e*9.)*.9*pul;
float ray=pow(fbm(vec2(a*4.,uT*.05+r*1.5))*1.3,3.)*exp(-e*4.5)*1.1;
float pr=smoothstep(.5,.8,fbm(vec2(cos(a),sin(a))*2.5+uT*.04))*exp(-e*22.)*step(R0,r)*2.2*(.6+.4*sin(uT*.9+a*3.));
float st=exp(-abs(p.y)*38.)*exp(-abs(p.x)*3.)*.55*pul+exp(-abs(p.x)*38.)*exp(-abs(p.y)*3.)*.25;
col+=vec3(1.,.55,.15)*(glow+ray)+vec3(1.,.4,.08)*pr+vec3(1.,.8,.5)*st;
col*=smoothstep(1.,.75,r);gl_FragColor=vec4(col,1.);}`;

/* ---------- WebGL cosmos ---------- */
const PR=Math.min(window.devicePixelRatio||1,2);
const rnd=Math.random,gs=()=>rnd()+rnd()+rnd()-1.5,ADD=THREE.AdditiveBlending;
let renderer,scene,camera,ready=false,baseFov=62,pm=[],nebs=[],sky,starsP,nearP,galaxy,bh,sun,rocks,rockData=[];
const pos=new THREE.Vector3(0,0,300),vel=new THREE.Vector3();
const BH=new THREE.Vector3(300,160,-1700),SUN=new THREE.Vector3(-1000,300,-1300),BELT=new THREE.Vector3(-380,40,-650);
const SM=(vs,fs,u,o)=>new THREE.ShaderMaterial(Object.assign({vertexShader:vs,fragmentShader:fs,uniforms:u,transparent:true,depthWrite:false},o||{}));
const KC=[[.6,.72,1],[.78,.86,1],[1,1,1],[1,.97,.92],[1,.84,.58],[1,.6,.4],[1,.36,.28]],KW=[.12,.18,.28,.15,.14,.08,.05];
const kc=()=>{let r=rnd(),i=0;while(i<6&&r>KW[i]){r-=KW[i];i++}return KC[i]};
function mkG(N,fn){
  const P=new Float32Array(N*3),C=new Float32Array(N*3),S=new Float32Array(N),H=new Float32Array(N);
  for(let i=0;i<N;i++){const o=fn(i);P.set(o.p,i*3);C.set(o.c,i*3);S[i]=o.s;H[i]=rnd()}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('aC',new THREE.BufferAttribute(C,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(S,1));g.setAttribute('aPh',new THREE.BufferAttribute(H,1));return g;
}
function PM(o){const m=SM(starV,starF,Object.assign({uPR:{value:PR},uT:{value:0},uScale:{value:0},uWrap:{value:0},uTw:{value:.3},uCam:{value:new THREE.Vector3()}},o),{blending:ADD});pm.push(m);return m}
function pts(g,m,ro){const p=new THREE.Points(g,m);p.frustumCulled=false;p.renderOrder=ro;return p}
function billboard(mat,size,at,ro){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),mat);m.scale.set(size,size,1);m.position.copy(at);m.renderOrder=ro;m.frustumCulled=false;scene.add(m);return m}

function initGL(){
  renderer=new THREE.WebGLRenderer({canvas:$('#bg'),antialias:false,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x000000,1);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.5,12000);camera.rotation.order='YXZ';

  // enveloping deep-field nebula sky
  sky=new THREE.Mesh(new THREE.SphereGeometry(9000,32,16),SM(skyV,skyF,{uT:{value:0},uL:{value:0}},{side:THREE.BackSide,depthTest:false}));
  sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);

  // layered volumetric nebula sheets
  const pal=[[[0,.55,.9],[.8,.1,.6]],[[.5,.2,1],[0,.7,.8]],[[1,.4,.15],[.8,.1,.4]],[[.1,.3,1],[.6,.15,.9]],[[0,.8,.7],[.3,.2,.9]],[[.9,.3,.5],[1,.6,.2]]];
  const NN=coarse?4:6;
  for(let k=0;k<NN;k++){
    const z=rnd()*2-1,a=rnd()*6.283,q=Math.sqrt(1-z*z),R=1800+rnd()*1700;
    const mt=SM(BV,nebF,{uT:{value:0},uSeed:{value:rnd()*50},uI:{value:.5},uC1:{value:new THREE.Vector3(...pal[k][0])},uC2:{value:new THREE.Vector3(...pal[k][1])}},{blending:ADD});
    nebs.push(billboard(mt,1600+rnd()*1400,new THREE.Vector3(q*Math.cos(a)*R,z*R*.6,q*Math.sin(a)*R),-2));
  }

  // 32k Kelvin-colored twinkling stars (follow camera) + near parallax layer
  starsP=pts(mkG(32000,()=>{const z=rnd()*2-1,a=rnd()*6.283,q=Math.sqrt(1-z*z),R=4000+rnd()*1500,b=.55+.45*rnd(),c=kc();
    return{p:[q*Math.cos(a)*R,z*R,q*Math.sin(a)*R],c:[c[0]*b,c[1]*b,c[2]*b],s:1.3+Math.pow(rnd(),7)*4}}),PM({}),-1);
  scene.add(starsP);
  nearP=pts(mkG(2400,()=>{const c=kc();return{p:[rnd()*900,rnd()*900,rnd()*900],c,s:1.4+Math.pow(rnd(),4)*2.6}}),PM({uWrap:{value:900},uTw:{value:.2}}),3);
  scene.add(nearP);

  // multi-arm spiral galaxy with dense core
  const NG=coarse?26000:46000,R=1500;
  const gg=mkG(NG,i=>{
    if(i<NG*.2){const r=Math.pow(rnd(),2.2)*R*.2,t=rnd()*6.283,b=.7+.3*rnd();
      return{p:[Math.cos(t)*r,gs()*r*.4,Math.sin(t)*r],c:[1*b,.82*b,.55*b],s:1.2+rnd()*1.6}}
    const arm=i%4,u=Math.pow(rnd(),.75),r=(.08+u*.92)*R,ang=arm*1.5708+u*5.2+gs()*.35*(1.1-u),sc=gs()*R*.05*(.4+u);
    const w=Math.min(1,u*1.6),b=.5+.5*rnd();let c=u<.35?[1,.85,.6]:u<.7?[.25,.8,1]:[.8,.3,1];
    if(rnd()<.06)c=[1,.35,.65];if(rnd()<.05)c=[.7,.85,1];
    return{p:[Math.cos(ang)*r+sc,gs()*R*.03*(1.1-u*.6),Math.sin(ang)*r+sc],c:[c[0]*b,c[1]*b,c[2]*b],s:.9+Math.pow(rnd(),5)*2.4}});
  galaxy=new THREE.Group();galaxy.position.set(700,-380,-3100);galaxy.rotation.set(1.1,0,.45);
  const gp=pts(gg,PM({uScale:{value:2800},uTw:{value:.12}}),0);galaxy.add(gp);scene.add(galaxy);

  // Gargantua-style black hole + sun
  bh=billboard(SM(BV,bhF,{uT:{value:0}},{blending:THREE.CustomBlending,blendEquation:THREE.AddEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneMinusSrcAlphaFactor}),1100,BH,1);
  sun=billboard(SM(BV,sunF,{uT:{value:0}},{blending:ADD}),700,SUN,2);

  // tumbling asteroid belt (instanced, lit by the sun and the accretion disk)
  const ag=new THREE.IcosahedronGeometry(1,1),ap=ag.attributes.position;
  for(let i=0;i<ap.count;i++){const x=ap.getX(i),y=ap.getY(i),z=ap.getZ(i);
    const k=1+.38*(Math.sin(x*4.1+1.3)*Math.sin(y*3.7+.4)*Math.sin(z*4.9+2.1))+.12*Math.sin(x*9+y*7);ap.setXYZ(i,x*k,y*k*.8,z*k)}
  ag.computeVertexNormals();
  const NA=coarse?280:520;
  rocks=new THREE.InstancedMesh(ag,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95,metalness:.08,flatShading:true}),NA);
  rocks.frustumCulled=false;const col=new THREE.Color();
  for(let i=0;i<NA;i++){
    const s=1.5+Math.pow(rnd(),3)*13;
    rockData.push({a:rnd()*6.283,r:260+rnd()*260,h:gs()*40,w:(.012+rnd()*.03)*(rnd()<.5?1:1),ax:new THREE.Vector3(gs(),gs(),gs()).normalize(),sp:.2+rnd()*1.2,ph:rnd()*6,s:[s,s*(.6+rnd()*.6),s*(.7+rnd()*.5)]});
    col.setHSL(.07+rnd()*.05,.15+rnd()*.25,.28+rnd()*.3);rocks.setColorAt(i,col);
  }
  scene.add(rocks);
  const sl=new THREE.PointLight(0xffe0b0,2.6,0,0);sl.position.copy(SUN);scene.add(sl);
  const bl=new THREE.PointLight(0xff8a30,.9,0,0);bl.position.copy(BH);scene.add(bl);
  scene.add(new THREE.HemisphereLight(0x5a78ff,0x201030,.35));
  ready=true;applyFov();
}
const dummy=new THREE.Object3D();
function updateRocks(t,dt){
  for(let i=0;i<rockData.length;i++){const d=rockData[i];d.a+=d.w*dt;
    const x=Math.cos(d.a)*d.r,z=Math.sin(d.a)*d.r*.9;
    dummy.position.set(BELT.x+x,BELT.y+d.h+Math.sin(d.a)*d.r*.16,BELT.z+z);
    dummy.quaternion.setFromAxisAngle(d.ax,d.sp*t+d.ph);dummy.scale.set(d.s[0],d.s[1],d.s[2]);dummy.updateMatrix();rocks.setMatrixAt(i,dummy.matrix)}
  rocks.instanceMatrix.needsUpdate=true;
}
function applyTheme(t){
  document.documentElement.dataset.theme=t;store.set('theme',t);$('#themeIc').innerHTML=t==='light'?ICON.moon:ICON.sun;
  if(!ready)return;const L=t==='light';sky.material.uniforms.uL.value=L?1:0;nebs.forEach(n=>n.material.uniforms.uI.value=L?.7:.5);
}

/* ---------- free-flight navigation ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let yaw=-.05,pitch=.05,yawT=-.05,pitchT=.05,zoom=1,zoomT=1,roll=0;
const ptrs=new Map();let pinchD=0;
const cv=$('#bg');
const camR=new THREE.Vector3(),camU=new THREE.Vector3(),camF=new THREE.Vector3(),tmp=new THREE.Vector3();
function applyFov(){if(!ready)return;baseFov=innerWidth<innerHeight?80:62;camera.fov=baseFov*zoom;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
function look(dx,dy){const s=.0046*clamp(zoom,.2,1.3);yawT+=dx*s;pitchT=clamp(pitchT+dy*s,-1.5,1.5)}
function pan(dx,dy){const k=.6*zoom;vel.addScaledVector(camR,-dx*k).addScaledVector(camU,dy*k)}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});pinchD=0});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){(e.shiftKey||p.b>0)?pan(dx,dy):look(dx,dy)}
  else if(ptrs.size===2){
    const o=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
    const d=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    if(pinchD>0)zoomT=clamp(zoomT*pinchD/d,.1,1.5);pinchD=d;pan(dx*.5,dy*.5);
  }
  p.x=e.clientX;p.y=e.clientY;
});
const end=e=>{ptrs.delete(e.pointerId);pinchD=0};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomT=clamp(zoomT*Math.exp(e.deltaY*.0013),.1,1.5)},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')yawT+=.08;else if(k==='arrowright'||k==='d')yawT-=.08;
  else if(k==='arrowup'||k==='w')pitchT=clamp(pitchT+.06,-1.5,1.5);else if(k==='arrowdown'||k==='s')pitchT=clamp(pitchT-.06,-1.5,1.5)});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#snd')){initAudio();if(AC&&AC.state==='suspended')AC.resume()}},{passive:true});

/* ---------- UI wiring ---------- */
const card=$('#card');
card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();
  card.style.setProperty('--gx',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--gy',((e.clientY-r.top)/r.height*100)+'%')},{passive:true});
$$('.link').forEach(l=>{
  l.addEventListener('pointermove',e=>{const r=l.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
    l.style.setProperty('--mx',(dx+.5)*100+'%');l.style.setProperty('--my',(dy+.5)*100+'%');l.style.transform=`translate(${dx*8}px,${dy*6}px) scale(1.025)`},{passive:true});
  l.addEventListener('pointerleave',()=>{l.style.transform=''});
});
$$('.link,.tog,#lang button').forEach(el=>{el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')chime()});el.addEventListener('click',click)});
$('#theme').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
$('#snd').addEventListener('click',()=>{if(!audioStarted){initAudio();setSound(true);return}setSound(!soundOn)});
$('#eye').addEventListener('click',()=>{hidden=!hidden;card.classList.toggle('gone',hidden);setEye();chime()});
$$('#lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
addEventListener('resize',()=>{if(!ready)return;renderer.setSize(innerWidth,innerHeight,false);applyFov()});

/* ---------- loop ---------- */
let last=performance.now(),cruise=reduce?8:34;
function repel(c,rad,dt){tmp.copy(pos).sub(c);const L=tmp.length();if(L<rad)pos.addScaledVector(tmp,(rad-L)/Math.max(L,1)*Math.min(1,dt*2.5))}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05),t=now/1000;last=now;
  const k=1-Math.exp(-dt*4.5);
  const dY=yawT-yaw;yaw+=dY*k;pitch+=(pitchT-pitch)*k;zoom+=(zoomT-zoom)*(1-Math.exp(-dt*6));
  roll+=(clamp(dY*.35,-.28,.28)-roll)*k;
  card.style.transform=`rotateX(${clamp((pitchT-pitch)*40,-6,6)}deg) rotateY(${clamp(-dY*40,-8,8)}deg)`;
  if(!ready)return;
  camera.rotation.set(pitch,yaw,roll,'YXZ');
  camF.set(0,0,-1).applyQuaternion(camera.quaternion);camR.set(1,0,0).applyQuaternion(camera.quaternion);camU.set(0,1,0).applyQuaternion(camera.quaternion);
  vel.multiplyScalar(Math.exp(-dt*1.6));
  pos.addScaledVector(camF,cruise*dt).addScaledVector(vel,dt);
  repel(BH,420,dt);repel(SUN,330,dt);if(pos.length()>4200)pos.multiplyScalar(1-dt*.3);
  camera.position.copy(pos);
  if(Math.abs(camera.fov-baseFov*zoom)>.01){camera.fov=baseFov*zoom;camera.updateProjectionMatrix()}
  sky.position.copy(pos);starsP.position.copy(pos);
  pm.forEach(m=>{m.uniforms.uT.value=t;m.uniforms.uCam.value.copy(pos)});
  sky.material.uniforms.uT.value=t;
  nebs.forEach(n=>{n.material.uniforms.uT.value=t;n.quaternion.copy(camera.quaternion)});
  bh.quaternion.copy(camera.quaternion);sun.quaternion.copy(camera.quaternion);bh.material.uniforms.uT.value=t;sun.material.uniforms.uT.value=t;
  galaxy.children[0].rotation.y=t*.008;
  updateRocks(t,dt);
  renderer.render(scene,camera);
}

/* ---------- boot ---------- */
setLang(lang);setSound(true);
try{initGL()}catch(e){console.warn('WebGL unavailable',e);ready=false}
applyTheme(store.get('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
